[build]
  # Next.js build (database migrations handled via Supabase)
  command = "npm run build"
  # Prevent Netlify defaulting publish to the repo root, which breaks @netlify/plugin-nextjs.
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  # Align with `.github/workflows/deploy-guard.yml` (Node 22) for consistent native ABI / tooling.
  NODE_VERSION = "22"
