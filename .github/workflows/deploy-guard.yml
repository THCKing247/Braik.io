name: Deploy Guard

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (prebuild runs typecheck via package.json)
        run: npm run build

      # Warning-first: does not fail CI unless budgets are tightened later (see PHASE_8_GUARDRAILS_REPORT.md).
      - name: Performance audit (informational)
        run: npm run perf:audit
